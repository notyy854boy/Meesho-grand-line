<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Bada Bhai God Engine V7 (True Dynamic AI)</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
  <script src="https://unpkg.com/lightweight-charts/dist/lightweight-charts.standalone.production.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700;800&display=swap');
    body { font-family: 'JetBrains Mono', monospace; background-color: #050505; color: #e5e7eb; overflow: hidden; }
    .glass { background: rgba(15, 23, 42, 0.95); border: 1px solid #1f2937; }
    
    .screen-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; transition: transform 0.3s ease-in-out; }
    .screen-active { transform: translateX(0); z-index: 10; }
    .screen-hidden-right { transform: translateX(100%); z-index: 1; }
    
    .crypto-scroll::-webkit-scrollbar { height: 2px; }
    .crypto-scroll::-webkit-scrollbar-track { background: #000; }
    .crypto-scroll::-webkit-scrollbar-thumb { background: #10b981; }
    .vertical-scroll::-webkit-scrollbar { width: 2px; }
    .vertical-scroll::-webkit-scrollbar-track { background: #000; }
    .vertical-scroll::-webkit-scrollbar-thumb { background: #10b981; }
    
    .z-top { z-index: 50; }
  </style>
</head>
<body class="h-screen w-screen flex flex-col relative">

  <!-- ========================================== -->
  <!-- GLOBAL HEADER & ALL MARKET SCANNER -->
  <!-- ========================================== -->
  <header class="glass p-2 border-b border-gray-800 z-top absolute top-0 w-full">
    <div class="flex justify-between items-center mb-1">
      <div class="flex items-center gap-2">
        <div class="w-2 h-2 bg-emerald-500 rounded-full animate-ping"></div>
        <span class="font-black text-transparent bg-clip-text bg-gradient-to-r from-emerald-400 to-cyan-500 text-sm">BADA BHAI V7</span>
      </div>
      <div class="text-[9px] text-cyan-400 font-bold bg-cyan-900/30 px-2 py-0.5 rounded">DYNAMIC AI LIVE</div>
    </div>
    
    <!-- Unlimited Live Crypto Ticker -->
    <div class="flex gap-2 overflow-x-auto crypto-scroll pb-1" id="ticker-bar">
      <div class="px-3 py-1 bg-gray-800/50 rounded border border-gray-700 text-[10px] text-gray-400 whitespace-nowrap" id="loading-text">Connecting Global Market...</div>
    </div>
  </header>

  <!-- ========================================== -->
  <!-- SCREEN 1: MAIN CHART -->
  <!-- ========================================== -->
  <div id="screen-main" class="screen-container screen-active pt-[70px] pb-2 px-2 flex flex-col gap-2 bg-black">
    
    <!-- TIMEFRAME SELECTOR -->
    <div class="flex gap-1 overflow-x-auto crypto-scroll py-1 shrink-0">
      <button onclick="changeTimeframe('1')" class="px-3 py-1 rounded bg-gray-800 text-xs font-bold text-gray-400 transition timeframe-btn" id="tf-1">1m</button>
      <button onclick="changeTimeframe('5')" class="px-3 py-1 rounded bg-gray-800 text-xs font-bold text-gray-400 transition timeframe-btn" id="tf-5">5m</button>
      <button onclick="changeTimeframe('15')" class="px-3 py-1 rounded bg-emerald-900/50 text-xs font-bold text-emerald-400 border border-emerald-500/50 transition timeframe-btn" id="tf-15">15m</button>
      <button onclick="changeTimeframe('60')" class="px-3 py-1 rounded bg-gray-800 text-xs font-bold text-gray-400 transition timeframe-btn" id="tf-60">1h</button>
      <button onclick="changeTimeframe('240')" class="px-3 py-1 rounded bg-gray-800 text-xs font-bold text-gray-400 transition timeframe-btn" id="tf-240">4h</button>
      <button onclick="changeTimeframe('D')" class="px-3 py-1 rounded bg-gray-800 text-xs font-bold text-gray-400 transition timeframe-btn" id="tf-D">1D</button>
    </div>

    <div class="flex-1 glass rounded-lg border-gray-800 relative w-full overflow-hidden">
      <div id="tv_chart" class="absolute inset-0"></div>
    </div>

    <!-- Bottom Controls -->
    <div class="glass p-2 rounded-lg border-gray-800 flex flex-col gap-2 shrink-0">
      <button onclick="playVoice()" class="w-full bg-emerald-500/10 hover:bg-emerald-500/20 border border-emerald-500 text-emerald-400 py-2 rounded-lg font-bold text-sm flex items-center justify-center gap-2 transition">
        <span>🔊</span> GENERATE AUDIO BRIEF
      </button>
      
      <div class="flex gap-2">
        <button onclick="openScreen('screen-prediction')" class="flex-1 bg-cyan-900/20 border border-cyan-500 text-cyan-400 py-2 rounded-lg font-bold text-xs flex flex-col items-center justify-center transition">
          <span class="text-base mb-1">🤖</span> AI DRAWING
        </button>
        <button onclick="openScreen('screen-news')" class="flex-1 bg-purple-900/20 border border-purple-500 text-purple-400 py-2 rounded-lg font-bold text-xs flex flex-col items-center justify-center transition">
          <span class="text-base mb-1">📰</span> MACRO NEWS
        </button>
      </div>
    </div>
  </div>

  <!-- ========================================== -->
  <!-- SCREEN 2: TRUE DYNAMIC AI PATTERN DRAWING -->
  <!-- ========================================== -->
  <div id="screen-prediction" class="screen-container screen-hidden-right pt-[70px] pb-2 px-2 flex flex-col gap-2 bg-black">
    <div class="flex justify-between items-center p-2 glass rounded-lg shrink-0">
      <button onclick="closeScreens()" class="text-white font-bold px-3 py-1 bg-red-600/80 rounded text-xs transition border border-red-500">⬅ BACK</button>
      <span class="text-cyan-400 font-bold text-[10px] px-2 bg-cyan-900/30 py-1 rounded" id="ai-target-coin">BTCUSDT AI LOGIC</span>
    </div>

    <!-- DYNAMIC AI REASONING BOX -->
    <div class="glass p-3 rounded-lg border-cyan-500/50 text-[10px] text-gray-300 shrink-0 leading-relaxed" id="ai-reasoning">
      <!-- Injected by JS based on coin trend -->
      Analyzing Market Structure...
    </div>

    <div class="flex-1 glass rounded-lg border-gray-800 relative w-full h-[400px] overflow-hidden">
      <div class="absolute top-2 left-2 z-10 glass px-2 py-1 rounded text-[9px] text-gray-400 font-bold">LIVE POSITION TOOL</div>
      <div id="ai_chart" class="absolute inset-0"></div>
    </div>
  </div>

  <!-- ========================================== -->
  <!-- SCREEN 3: NEWS PANEL -->
  <!-- ========================================== -->
  <div id="screen-news" class="screen-container screen-hidden-right pt-[70px] pb-2 px-2 flex flex-col gap-2 bg-black">
    <div class="flex justify-between items-center p-2 glass rounded-lg shrink-0">
      <button onclick="closeScreens()" class="text-white font-bold px-3 py-1 bg-red-600/80 rounded text-xs transition border border-red-500">⬅ BACK</button>
      <span class="text-purple-400 font-bold text-[10px] px-2 bg-purple-900/30 py-1 rounded">TWITTER & MACRO NEWS</span>
    </div>

    <div class="flex-1 overflow-y-auto space-y-2 pb-4 vertical-scroll pr-1" id="dynamic-news">
      <!-- News injected dynamically based on coin -->
    </div>
  </div>

  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) { tg.expand(); tg.setHeaderColor('#050505'); tg.setBackgroundColor('#050505'); }

    let currentSymbol = "BTCUSDT";
    let currentTimeframe = "15";
    let tvWidget = null;
    let aiChartInstance = null;
    let hasRenderedAI = false;
    
    // Global store for real live prices so AI can calculate properly
    const liveMarketData = {};

    // ==========================================
    // 1. TRADINGVIEW MAIN CHART 
    // ==========================================
    function loadTVChart(symbol, interval) {
      if (tvWidget) { tvWidget.remove(); }
      tvWidget = new TradingView.widget({
        "autosize": true,
        "symbol": "BINANCE:" + symbol,
        "interval": interval,
        "timezone": "Asia/Kolkata",
        "theme": "dark",
        "style": "1",
        "locale": "en",
        "backgroundColor": "rgba(0,0,0,0)",
        "enable_publishing": false,
        "hide_top_toolbar": true,
        "hide_legend": true,
        "container_id": "tv_chart"
      });
      document.getElementById('ai-target-coin').innerText = symbol + " AI LOGIC (" + interval + "m)";
    }
    loadTVChart(currentSymbol, currentTimeframe);

    function changeTimeframe(tf) {
      currentTimeframe = tf;
      document.querySelectorAll('.timeframe-btn').forEach(btn => {
        btn.className = "px-3 py-1 rounded bg-gray-800 text-xs font-bold text-gray-400 transition timeframe-btn";
      });
      const activeBtn = document.getElementById('tf-' + tf);
      activeBtn.className = "px-3 py-1 rounded bg-emerald-900/50 text-xs font-bold text-emerald-400 border border-emerald-500/50 transition timeframe-btn";
      loadTVChart(currentSymbol, currentTimeframe);
      if(hasRenderedAI) renderAIChart();
    }

    // ==========================================
    // 2. SCREEN NAVIGATION
    // ==========================================
    function openScreen(screenId) {
      document.getElementById('screen-main').classList.remove('screen-active');
      document.getElementById('screen-main').style.transform = 'translateX(-100%)';
      const targetScreen = document.getElementById(screenId);
      targetScreen.classList.remove('screen-hidden-right');
      targetScreen.classList.add('screen-active');

      if (screenId === 'screen-prediction') {
        setTimeout(renderAIChart, 100); 
        hasRenderedAI = true;
      }
      if (screenId === 'screen-news') {
        updateDynamicNews();
      }
    }

    function closeScreens() {
      document.getElementById('screen-prediction').classList.remove('screen-active');
      document.getElementById('screen-prediction').classList.add('screen-hidden-right');
      document.getElementById('screen-news').classList.remove('screen-active');
      document.getElementById('screen-news').classList.add('screen-hidden-right');
      const mainScreen = document.getElementById('screen-main');
      mainScreen.style.transform = 'translateX(0)';
      mainScreen.classList.add('screen-active');
    }

    // ==========================================
    // 3. UNLIMITED COIN SCANNER 
    // ==========================================
    const binanceWS = new WebSocket("wss://stream.binance.com:9443/ws/!miniTicker@arr");
    const tickerBar = document.getElementById('ticker-bar');
    const trackedElements = {};

    binanceWS.onmessage = (event) => {
      const dataArray = JSON.parse(event.data);
      const loader = document.getElementById('loading-text');
      if(loader) loader.remove();

      dataArray.forEach(data => {
        if(data.s.endsWith('USDT')) {
          const sym = data.s;
          const price = parseFloat(data.c);
          const openPrice = parseFloat(data.o);
          const changePct = ((price - openPrice) / openPrice) * 100;
          
          // Save real data for AI Brain
          liveMarketData[sym] = { price: price, change: changePct };

          const isUp = changePct >= 0;
          const color = isUp ? "text-emerald-400" : "text-red-400";
          const bg = isUp ? "bg-emerald-900/20 border-emerald-500/50" : "bg-red-900/20 border-red-500/50";
          
          if (!trackedElements[sym]) {
            if(tickerBar.childElementCount < 50 || ['BTCUSDT','ETHUSDT','SOLUSDT','BNBUSDT','DOGEUSDT'].includes(sym)) {
              let item = document.createElement('div');
              item.id = `tick-${sym}`;
              item.onclick = () => { 
                  currentSymbol = sym; 
                  loadTVChart(sym, currentTimeframe); 
                  if(hasRenderedAI) renderAIChart(); 
              };
              tickerBar.appendChild(item);
              trackedElements[sym] = item;
            }
          }
          
          if(trackedElements[sym]) {
            const isActive = sym === currentSymbol;
            const activeClass = isActive ? "border-cyan-400 bg-cyan-900/40" : bg;
            trackedElements[sym].className = `flex-shrink-0 px-2 py-1 rounded border cursor-pointer active:scale-95 transition flex flex-col items-center justify-center min-w-[70px] ${activeClass}`;
            trackedElements[sym].innerHTML = `
              <span class="font-bold text-white text-[10px] leading-none mb-0.5">${sym.replace('USDT','')}</span>
              <span class="font-mono text-[9px] leading-none ${color}">${price.toFixed(4).replace(/\.?0+$/, '')}</span>
            `;
          }
        }
      });
    };

    // ==========================================
    // 4. TRUE DYNAMIC AI PATTERN DRAWING
    // ==========================================
    function renderAIChart() {
      const container = document.getElementById('ai_chart');
      if (aiChartInstance) container.innerHTML = '';

      aiChartInstance = LightweightCharts.createChart(container, {
        layout: { background: { type: 'solid', color: '#050505' }, textColor: '#9ca3af' },
        grid: { vertLines: { color: 'rgba(31, 41, 55, 0.4)' }, horzLines: { color: 'rgba(31, 41, 55, 0.4)' } },
        crosshair: { mode: 1 },
        timeScale: { timeVisible: true, borderColor: 'rgba(31, 41, 55, 0.8)' }
      });

      const candleSeries = aiChartInstance.addCandlestickSeries({ 
          upColor: '#10b981', downColor: '#ef4444', borderVisible: false, 
          wickUpColor: '#10b981', wickDownColor: '#ef4444' 
      });
      
      // Get Real Context Data for this specific coin
      const coinData = liveMarketData[currentSymbol] || { price: 65000, change: 1.5 };
      const isBullish = coinData.change >= 0;
      
      // Generate Candlesticks ending at REAL current price
      const currentUnix = Math.floor(Date.now() / 1000);
      let mockData = [];
      let basePrice = coinData.price;
      
      // Reverse engineer past candles based on current trend (If bullish, past was lower)
      let lastPrice = isBullish ? basePrice * 0.98 : basePrice * 1.02; 
      let volatility = basePrice * 0.005; 
      
      for (let i = 100; i > 0; i--) {
        // Move towards the actual current price
        let trendStep = (basePrice - lastPrice) / i;
        lastPrice = lastPrice + trendStep + (Math.random() * volatility - (volatility/2));
        
        let open = lastPrice;
        let close = lastPrice + (Math.random() * volatility - (volatility/2));
        // Force the very last candle to match exactly the live price
        if (i === 1) close = basePrice;

        let high = Math.max(open, close) + (Math.random() * (volatility/2));
        let low = Math.min(open, close) - (Math.random() * (volatility/2));
        
        mockData.push({ time: currentUnix - (i * 900), open: open, high: high, low: low, close: close });
      }
      candleSeries.setData(mockData);

      // --- DYNAMIC AI MATH (Calculates different SL/TP based on trend) ---
      const entryPrice = mockData[mockData.length-1].close;
      const tpDistance = basePrice * 0.02; // 2% target
      const slDistance = basePrice * 0.008; // 0.8% stop loss
      
      const boxStart = mockData[mockData.length-20].time;
      const boxEnd = currentUnix + (3600 * 4); 

      let tpAreaColor, tpLineColor, slAreaColor, slLineColor, targetPrice, stopPrice, trendlineStartVal;

      if (isBullish) {
          // LONG SETUP
          targetPrice = entryPrice + tpDistance;
          stopPrice = entryPrice - slDistance;
          trendlineStartVal = entryPrice - (tpDistance * 1.5);
          
          tpAreaColor = { top: 'rgba(16, 185, 129, 0.4)', bottom: 'rgba(16, 185, 129, 0.1)', line: '#10b981' };
          slAreaColor = { top: 'rgba(239, 68, 68, 0.1)', bottom: 'rgba(239, 68, 68, 0.4)', line: '#ef4444' };
          
          generateDynamicText("LONG", coinData.change);
      } else {
          // SHORT SETUP
          targetPrice = entryPrice - tpDistance;
          stopPrice = entryPrice + slDistance;
          trendlineStartVal = entryPrice + (tpDistance * 1.5);

          // In Short, TP is Red (Down), SL is Green (Up risk) -> Or conventionally TP is Green below, SL is Red above.
          // Let's keep TP Green (profit zone) but it will be drawn BELOW the entry.
          tpAreaColor = { top: 'rgba(16, 185, 129, 0.1)', bottom: 'rgba(16, 185, 129, 0.4)', line: '#10b981' };
          slAreaColor = { top: 'rgba(239, 68, 68, 0.4)', bottom: 'rgba(239, 68, 68, 0.1)', line: '#ef4444' };
          
          generateDynamicText("SHORT", coinData.change);
      }

      // Draw TP Box
      const tpArea = aiChartInstance.addAreaSeries({ topColor: tpAreaColor.top, bottomColor: tpAreaColor.bottom, lineColor: tpAreaColor.line, lineWidth: 2 });
      tpArea.setData([{time: boxStart, value: targetPrice}, {time: boxEnd, value: targetPrice}]);
      const entryLine = aiChartInstance.addLineSeries({ color: tpAreaColor.line, lineWidth: 2, lineStyle: 2 });
      entryLine.setData([{time: boxStart, value: entryPrice}, {time: boxEnd, value: entryPrice}]);

      // Draw SL Box
      const slArea = aiChartInstance.addAreaSeries({ topColor: slAreaColor.top, bottomColor: slAreaColor.bottom, lineColor: slAreaColor.line, lineWidth: 2 });
      slArea.setData([{time: boxStart, value: entryPrice}, {time: boxEnd, value: entryPrice}]);
      const stopLine = aiChartInstance.addLineSeries({ color: slAreaColor.line, lineWidth: 2, lineStyle: 2 });
      stopLine.setData([{time: boxStart, value: stopPrice}, {time: boxEnd, value: stopPrice}]);

      // Dynamic Trendline (Fibonacci)
      const fibLine = aiChartInstance.addLineSeries({ color: '#22d3ee', lineWidth: 2, lineStyle: 1 });
      fibLine.setData([{time: mockData[10].time, value: trendlineStartVal}, {time: currentUnix, value: entryPrice}]);
      
      aiChartInstance.timeScale().fitContent();
    }

    // 5. DYNAMIC AI TEXT GENERATOR
    function generateDynamicText(setupType, changePct) {
      const reasonsLong = [
        "Orderblock mitigate ho chuka hai. Volume profile positive hai.",
        "Bullish MACD crossover detected. RSI oversold zone se bounce hua hai.",
        "Whale accumulation zone confirmed on On-Chain data."
      ];
      const reasonsShort = [
        "Support level break hua hai. Heavy institutional selling pressure.",
        "Bearish divergence on RSI. Liquidity grab above resistance complete.",
        "Funding rates excessively high. Retail longs are being trapped."
      ];
      
      // Pick a random reason to make it feel alive
      const arr = setupType === "LONG" ? reasonsLong : reasonsShort;
      const randomReason = arr[Math.floor(Math.random() * arr.length)];
      const targetColor = setupType === "LONG" ? "text-emerald-400" : "text-red-400";
      
      document.getElementById('ai-reasoning').innerHTML = `
        <strong class="${targetColor} text-xs tracking-wider">🎯 TARGET LOCKED: ${setupType}</strong><br>
        <span class="text-white">${currentSymbol}</span> is currently <span class="${changePct>=0?'text-emerald-400':'text-red-400'} font-bold">${changePct.toFixed(2)}%</span>. 
        <span class="text-yellow-400 font-bold">Fibonacci validation</span> successful. <br>
        ${randomReason} Chart par position draw kar di gayi hai.
      `;
    }

    // 6. DYNAMIC NEWS GENERATOR
    function updateDynamicNews() {
      document.getElementById('dynamic-news').innerHTML = `
        <a href="#" class="block p-3 glass rounded border-gray-800 border-l-2 border-l-blue-500">
          <div class="flex justify-between items-center mb-1">
            <span class="text-[9px] text-blue-400 bg-blue-900/20 px-1 rounded">X (Twitter) Sentiment</span>
            <span class="text-[9px] text-gray-500">Live</span>
          </div>
          <div class="text-xs font-bold text-gray-200">Social volume for ${currentSymbol} spiked by 340% in last hour.</d
