<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>BADA BHAI 2026 TERMINAL</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
  <style>
    @keyframes pulse-neon {
      0%, 100% { box-shadow: 0 0 15px rgba(0, 255, 170, 0.4); }
      50% { box-shadow: 0 0 35px rgba(0, 255, 170, 0.8); }
    }
    .neon-border { animation: pulse-neon 2.5s infinite; }
    .glass { background: rgba(13, 17, 23, 0.75); backdrop-filter: blur(16px); }
  </style>
</head>
<body class="bg-black text-gray-100 font-sans min-h-screen overflow-x-hidden selection:bg-emerald-500">

  <!-- Header -->
  <header class="p-4 border-b border-gray-800 flex justify-between items-center glass sticky top-0 z-50">
    <div class="flex items-center space-x-2">
      <div class="w-3 h-3 bg-emerald-400 rounded-full animate-ping"></div>
      <span class="font-extrabold tracking-widest text-transparent bg-clip-text bg-gradient-to-r from-emerald-400 to-cyan-500 text-sm">
        BADA BHAI APEX 2026
      </span>
    </div>
    <span class="text-xs bg-emerald-950 border border-emerald-600/50 text-emerald-300 px-2 py-0.5 rounded-full font-mono">
      LIVE ALPHA RADAR
    </span>
  </header>

  <main class="p-4 space-y-4 max-w-2xl mx-auto">
    <!-- Live Alpha Card -->
    <div id="alpha-card" class="p-4 rounded-2xl border border-emerald-500/40 glass neon-border">
      <div class="flex justify-between items-start">
        <div>
          <span class="text-[10px] text-gray-400 uppercase font-mono">Accuracy: <b class="text-emerald-400 font-bold">100%</b></span>
          <h2 class="text-2xl font-black tracking-tight flex items-center gap-2 mt-0.5">
            <span id="coin-symbol">BTCUSDT</span>
            <span id="coin-badge" class="text-xs bg-emerald-500/20 text-emerald-400 border border-emerald-500/40 px-2 py-0.5 rounded-md">BUY</span>
          </h2>
        </div>
        <div class="text-right">
          <div class="text-xs text-gray-400">Live Profit</div>
          <div id="coin-rr" class="text-lg font-mono font-bold text-emerald-400">Scanning...</div>
        </div>
      </div>
      
      <div class="mt-3 bg-black/40 p-2.5 rounded-lg border border-gray-800 text-xs text-gray-300 flex items-start gap-2">
        <span class="text-emerald-400 text-base">🎙️</span>
        <p id="bada-bhai-verdict">"Bhai, system boot ho gaya hai. Live data process kar raha hu..."</p>
      </div>
    </div>

    <!-- Live Chart -->
    <div class="rounded-2xl overflow-hidden border border-gray-800 glass h-[380px] relative">
      <div id="tradingview_chart" class="w-full h-full"></div>
    </div>

    <!-- Voice Control -->
    <div class="glass p-3 rounded-2xl border border-gray-800 flex items-center justify-between">
      <div class="flex items-center gap-2">
        <div class="w-2 h-2 rounded-full bg-cyan-400 animate-pulse"></div>
        <span class="text-xs text-gray-300 font-medium">Bada Bhai Audio Link</span>
      </div>
      <button onclick="playAudio()" class="bg-gradient-to-r from-emerald-500 to-cyan-600 text-black font-bold text-xs px-4 py-2 rounded-xl">
        🔊 Play Alert
      </button>
    </div>
  </main>

  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) { tg.expand(); tg.setHeaderColor('#000000'); }

    let tvWidget = new TradingView.widget({
      "autosize": true,
      "symbol": "BINANCE:BTCUSDT",
      "interval": "5",
      "timezone": "Asia/Kolkata",
      "theme": "dark",
      "style": "1",
      "locale": "en",
      "enable_publishing": false,
      "hide_top_toolbar": false,
      "hide_legend": false,
      "container_id": "tradingview_chart"
    });

    const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
    const socket = new WebSocket(`${protocol}//${window.location.host}/ws/terminal`);

    socket.onmessage = function(event) {
      const data = JSON.parse(event.data);
      if(data.symbol) {
        document.getElementById('coin-symbol').innerText = data.symbol;
        document.getElementById('coin-badge').innerText = data.action;
        document.getElementById('coin-rr').innerText = data.rr + " RR";
        document.getElementById('bada-bhai-verdict').innerText = `Bhai, ${data.symbol} mein momentum hai. Live RR ${data.rr} chal raha hai!`;
      }
    };

    function playAudio() {
      const audio = new Audio('/api/voice');
      audio.play();
    }
  </script>
</body>
</html>
